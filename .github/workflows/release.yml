name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.2). Leave empty for artifact-only build."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            CREATE_RELEASE=true
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            CREATE_RELEASE=true
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
            if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              git checkout "refs/tags/${TAG}"
            else
              echo "::warning::Tag ${TAG} not found locally; building current ref and releasing as ${TAG}"
            fi
          else
            TAG=""
            CREATE_RELEASE=false
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "create_release=${CREATE_RELEASE}" >> "$GITHUB_OUTPUT"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test audio pipeline and assemble debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Prepare APK artifact
        id: apk
        run: |
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          if [ -n "${{ steps.meta.outputs.tag }}" ]; then
            NAME="sleep-desk-${{ steps.meta.outputs.tag }}-debug.apk"
          else
            NAME="sleep-desk-debug-${{ steps.meta.outputs.short_sha }}.apk"
          fi
          DEST="app/build/outputs/apk/debug/${NAME}"
          cp "$SRC" "$DEST"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sleep-desk-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.meta.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
