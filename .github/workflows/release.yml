name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.2). Leave empty for artifact-only build."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            CREATE_RELEASE=true
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            CREATE_RELEASE=true
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
            if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              git checkout "refs/tags/${TAG}"
            else
              echo "::warning::Tag ${TAG} not found locally; building current ref and releasing as ${TAG}"
            fi
          else
            TAG=""
            CREATE_RELEASE=false
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "create_release=${CREATE_RELEASE}" >> "$GITHUB_OUTPUT"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Decode upload keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set — debug signing"
            echo "HAS_UPLOAD_KEYSTORE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/sleep-desk-upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "HAS_UPLOAD_KEYSTORE=true" >> "$GITHUB_ENV"
          echo "Wrote keystore ($(wc -c < "$KEYSTORE_PATH") bytes)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test and assemble APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest --no-daemon
          if [ "${HAS_UPLOAD_KEYSTORE}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            OUT_DIR=app/build/outputs/apk/release
            VARIANT=release
          else
            ./gradlew assembleDebug --no-daemon
            OUT_DIR=app/build/outputs/apk/debug
            VARIANT=debug
          fi
          echo "APK_VARIANT=$VARIANT" >> "$GITHUB_ENV"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - name: Prepare APK artifact
        id: apk
        run: |
          SRC=$(ls "$OUT_DIR"/*.apk | grep -v unsigned | head -n1)
          if [ -n "${{ steps.meta.outputs.tag }}" ]; then
            NAME="sleep-desk-${{ steps.meta.outputs.tag }}-${APK_VARIANT}.apk"
          else
            NAME="sleep-desk-${APK_VARIANT}-${{ steps.meta.outputs.short_sha }}.apk"
          fi
          DEST="$OUT_DIR/${NAME}"
          cp "$SRC" "$DEST"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -la "$OUT_DIR"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sleep-desk-${{ env.APK_VARIANT }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.meta.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
