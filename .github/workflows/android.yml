name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Test workflow release safeguards
        run: uv run --python 3.12 --with pyyaml==6.0.3 python -m unittest discover -s .github/tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Decode upload keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set — default debug signing"
            echo "HAS_UPLOAD_KEYSTORE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/sleep-desk-upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "HAS_UPLOAD_KEYSTORE=true" >> "$GITHUB_ENV"
          echo "Wrote keystore ($(wc -c < "$KEYSTORE_PATH") bytes)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test audio pipeline and assemble APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # With upload secrets, debug + release buildTypes both use the upload key
          # (see app/build.gradle.kts). Keep assembleDebug so auto-release paths stay stable.
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
          if [ "${HAS_UPLOAD_KEYSTORE}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Rename APK with short SHA
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          DEST="app/build/outputs/apk/debug/sleep-desk-debug-${SHORT_SHA}.apk"
          cp "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> "$GITHUB_ENV"
          ls -la app/build/outputs/apk/debug/
          if [ "${HAS_UPLOAD_KEYSTORE}" = "true" ] && ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            RSRC=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1)
            RDEST="app/build/outputs/apk/release/sleep-desk-release-${SHORT_SHA}.apk"
            cp "$RSRC" "$RDEST"
            echo "RELEASE_APK_PATH=$RDEST" >> "$GITHUB_ENV"
            ls -la app/build/outputs/apk/release/
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sleep-desk-debug
          path: app/build/outputs/apk/debug/sleep-desk-debug-*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.HAS_UPLOAD_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sleep-desk-release
          path: app/build/outputs/apk/release/sleep-desk-release-*.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: main-auto-release
      cancel-in-progress: false
    steps:
      - name: Download tested APK from this run
        uses: actions/download-artifact@v4
        with:
          name: sleep-desk-debug
          path: release-apk

      - name: Download signed release APK if present
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sleep-desk-release
          path: release-apk

      - name: Resolve automatic release identity
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "tag=main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          test -s "release-apk/sleep-desk-debug-${SHORT_SHA}.apk"
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$MAIN_SHA" = "$GITHUB_SHA" ]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish tested main build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-apk/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: ${{ steps.meta.outputs.make_latest }}
          body: |
            Automated main-branch build. Attached APK(s) come from this run after tests passed
            (not a separate rebuild).

            App version is in app/build.gradle.kts; the release tag identifies this CI run/commit.
            When repository Secrets include the upload keystore, debug/release builds share that
            signing key so upgrades stay consistent with local packaging.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
